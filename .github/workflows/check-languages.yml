name: Check Languages Consistency

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run language consistency check
        run: python scripts/check-languages.py
