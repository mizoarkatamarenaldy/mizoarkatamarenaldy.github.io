<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Choose Your Language</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #121016;
      color: #EDEAF0;
    }
    h1 {
      font-size: 1.2rem;
      font-weight: normal;
      text-align: center;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    .lang-options {
      display: flex;
      gap: 1.5rem;
    }
    .lang-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
      border: 1px solid rgba(187,101,136,0.3);
      border-radius: 12px;
      text-decoration: none;
      color: #EDEAF0;
      transition: 0.2s;
      box-sizing: border-box;
    }
    .lang-card:hover {
      background: rgba(187,101,136,0.15);
      border-color: #BB6588;
    }
    .flag {
      width: 48px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <h1>
    Choose your language<br>
    Pilih bahasa Anda<br>
    言語を選択してください
  </h1>
  <div class="lang-options">
    <a class="lang-card" href="/id/main/">
      <img class="flag" src="https://flagcdn.com/w80/id.png" alt="Indonesia">
      Indonesia
    </a>
    <a class="lang-card" href="/en/main/">
      <img class="flag" src="https://flagcdn.com/w80/gb.png" alt="UK">
      English
    </a>
    <a class="lang-card" href="/ja/main/">
      <img class="flag" src="https://flagcdn.com/w80/jp.png" alt="Japan">
      日本語
    </a>
  </div>
</body>
</html>
