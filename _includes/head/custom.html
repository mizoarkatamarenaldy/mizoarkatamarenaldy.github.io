<style>
/* Easter egg trigger: kanji 奏, pojok kanan bawah, menyatu dengan background */
.kanade-trigger {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--kanade-bg) !important;
  text-decoration: none !important;
  z-index: 9999 !important;
  transition: color 0.3s ease;
  user-select: none;
  -webkit-user-select: none;
}
.kanade-trigger:hover,
.kanade-trigger:focus,
.kanade-trigger:focus-visible {
  color: var(--kanade-accent) !important;
  outline: none;
}

/* HOME: motto 3E sebagai link ke halaman 3E */
.home-motto {
  font-size: 1.25em;
  font-weight: bold;
}
.home-motto a {
  color: var(--kanade-text);
  text-decoration: underline dotted var(--kanade-accent);
  text-underline-offset: 0.25em;
  transition: color 0.2s ease;
}
.home-motto a::after {
  content: " →";
  opacity: 0;
  transition: opacity 0.2s ease;
}
.home-motto a:hover,
.home-motto a:focus-visible {
  color: var(--kanade-accent);
  text-decoration-style: solid;
}
.home-motto a:hover::after,
.home-motto a:focus-visible::after {
  opacity: 1;
}

/* HOME: bagian buka-tutup portofolio */
.home-portfolio {
  margin: 1em 0;
  padding: 0.5em 1em;
  border: 1px solid var(--kanade-accent);
  border-radius: 4px;
}
.home-portfolio summary {
  cursor: pointer;
  font-weight: bold;
}
.home-portfolio summary:hover,
.home-portfolio summary:focus-visible {
  color: var(--kanade-accent);
}

/* HOME: tombol link ke sub-halaman (portofolio, About, Contact) */
.home-links {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
  gap: 0.6rem;
  margin: 0.75em 0;
  padding: 0;
  list-style: none;
}
.home-links li {
  margin: 0;
}
.home-pages {
  margin-top: 1.5em;
}
.page__content .home-links a.home-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 2.75rem;
  padding: 0.5em 0.9em;
  border: 1px solid var(--kanade-accent);
  border-radius: 4px;
  background-color: var(--kanade-bg);
  color: var(--kanade-text);
  font-size: 0.9em;
  line-height: 1.3;
  text-align: center;
  text-decoration: none;
  transition: background-color 0.2s ease, color 0.2s ease;
}
@media (hover: hover) {
  .page__content .home-links a.home-btn:hover {
    background-color: var(--kanade-accent);
    color: var(--kanade-bg);
    text-decoration: none;
  }
}
.page__content .home-links a.home-btn:active {
  background-color: var(--kanade-accent);
  color: var(--kanade-bg);
}
.page__content .home-links a.home-btn:focus {
  outline: none;
}
.page__content .home-links a.home-btn:focus-visible {
  background-color: var(--kanade-accent);
  color: var(--kanade-bg);
  outline: 2px solid var(--kanade-text);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .page__content .home-links a.home-btn {
    transition: none;
  }
}

/* Embed YouTube */
.youtube-wrapper {
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 9;
  background-color: var(--kanade-bg);
  border: 1px solid var(--kanade-accent);
  border-radius: 4px;
  overflow: hidden;
  margin: 1.5em 0;
}
.youtube-wrapper iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Lazy Image */
.lazy-image-wrapper {
  margin: 1.5em 0;
  text-align: center;
}
.lazy-image-wrapper img.lazy-image {
  max-width: 100%;
  height: auto;
  display: inline-block;
  background-color: var(--kanade-bg);
  border-radius: 4px;
}
.lazy-image-wrapper figcaption {
  font-size: 0.9em;
  color: var(--kanade-text);
  opacity: 0.8;
  margin-top: 0.5em;
}

/* Navigasi Portofolio */
.portfolio-nav-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin: 2em 0 1em;
}
@media (max-width: 600px) {
  .portfolio-nav-wrapper {
    grid-template-columns: 1fr;
  }
}
.portfolio-nav-wrapper a.home-btn {
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
  padding: 0.75em 1em;
}
.portfolio-nav-wrapper .prev-btn {
  align-items: flex-start;
  text-align: left;
  grid-column: 1;
}
.portfolio-nav-wrapper .next-btn {
  align-items: flex-end;
  text-align: right;
  grid-column: 2;
}
.portfolio-nav-label {
  font-size: 0.8em;
  opacity: 0.8;
  margin-bottom: 0.3em;
}
.portfolio-nav-title {
  font-weight: bold;
  font-size: 1.05em;
}
</style>

<!-- end custom head snippets -->
