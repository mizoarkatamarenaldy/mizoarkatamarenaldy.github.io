<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>[TEKS DARI MIZO]</title>
  <link rel="stylesheet" href="/assets/css/kanade-palette.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--kanade-bg);
      color: var(--kanade-text);
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 4rem;
    }

    .kanji-deco {
      font-size: 5rem;
      color: var(--kanade-accent);
      opacity: 0.25;
      line-height: 1;
      margin-bottom: 1.5rem;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: normal;
      text-align: center;
      color: var(--kanade-text);
      margin-bottom: 2.5rem;
    }

    .content {
      max-width: 640px;
      width: 100%;
      line-height: 1.9;
      margin-bottom: 2.5rem;
    }

    .wiki-link {
      display: inline-block;
      margin-bottom: 4rem;
      color: var(--kanade-accent);
      text-decoration: underline;
      text-underline-offset: 0.25em;
      transition: opacity 0.2s;
    }

    .wiki-link:hover {
      opacity: 0.7;
    }

    .lang-nav {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .lang-nav a {
      color: var(--kanade-text);
      text-decoration: none;
      font-size: 0.875rem;
      opacity: 0.4;
      border-bottom: 1px solid currentColor;
      padding-bottom: 0.125rem;
      transition: opacity 0.2s, color 0.2s;
    }

    .lang-nav a[aria-current="page"],
    .lang-nav a:hover {
      color: var(--kanade-accent);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="kanji-deco" aria-hidden="true">奏</div>

  <h1>[TEKS DARI MIZO]</h1>

  <div class="content">
    <p>[TEKS DARI MIZO]</p>
  </div>

  <a class="wiki-link" href="[TEKS DARI MIZO]" target="_blank" rel="noopener noreferrer">[TEKS DARI MIZO]</a>

  <nav class="lang-nav" aria-label="Choose language">
    <a href="/奏/id/">Indonesia</a>
    <a href="/奏/en/" aria-current="page">English</a>
    <a href="/奏/ja/">日本語</a>
  </nav>
</body>
</html>
