<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>奏</title>
  <script>
    (function () {
      var langs = navigator.languages || [navigator.language || ''];
      var lang = 'en';
      for (var i = 0; i < langs.length; i++) {
        var code = langs[i].toLowerCase().split('-')[0];
        if (code === 'id') { lang = 'id'; break; }
        if (code === 'ja') { lang = 'ja'; break; }
        if (code === 'en') { lang = 'en'; break; }
      }
      window.location.replace('/\u594f/' + lang + '/');
    })();
  </script>
</head>
<body>
  <noscript>
    <p>
      <a href="/奏/id/">Indonesia</a> ·
      <a href="/奏/en/">English</a> ·
      <a href="/奏/ja/">日本語</a>
    </p>
  </noscript>
</body>
</html>
